<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Shrinking Contract</title>
<meta name="description" content="ELA #2 classroom bargaining game: a Firm and its Supplier split a contract surplus that shrinks with every rejection.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121a26'/%3E%3Crect x='6' y='8' width='20' height='6' rx='1.5' fill='%236ea4ee'/%3E%3Crect x='6' y='18' width='14' height='6' rx='1.5' fill='%23eba45c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a negotiating table. Firm on the left, Supplier on the right, and between them
   the contract's surplus drawn as a bar that loses 10% each time a proposal is rejected. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #121a26;
  --muted: #586374;
  --line: #d2d8e1;
  --line-strong: #aeb8c6;
  --firm: #1f5aa6;
  --firm-soft: #dde8f7;
  --firm-ink: #ffffff;
  --sup: #a6560b;
  --sup-soft: #f7e7d4;
  --sup-ink: #ffffff;
  --lost: #8c96a6;
  --ok: #1d7a4c;
  --ok-soft: #dcf1e5;
  --bad: #b3332b;
  --bad-soft: #f8e1df;
  --warn: #9a6200;
  --shadow: 0 1px 2px rgba(18, 26, 38, .06), 0 4px 16px rgba(18, 26, 38, .06);
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --step--1: .875rem;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: 2.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --surface-2: #1b2431; --ink: #e8edf4; --muted: #9ba7b9;
    --line: #2a3546; --line-strong: #43516a; --firm: #6ea4ee; --firm-soft: #1b2d48; --firm-ink: #0b1220;
    --sup: #eba45c; --sup-soft: #3b2a17; --sup-ink: #1a1006; --lost: #6c7789; --ok: #4dc48b; --ok-soft: #133024;
    --bad: #f1817a; --bad-soft: #3a1a18; --warn: #e6b450;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --surface-2: #1b2431; --ink: #e8edf4; --muted: #9ba7b9;
  --line: #2a3546; --line-strong: #43516a; --firm: #6ea4ee; --firm-soft: #1b2d48; --firm-ink: #0b1220;
  --sup: #eba45c; --sup-soft: #3b2a17; --sup-ink: #1a1006; --lost: #6c7789; --ok: #4dc48b; --ok-soft: #133024;
  --bad: #f1817a; --bad-soft: #3a1a18; --warn: #e6b450;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  margin: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-stretch: 112%; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
.num, .money { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.eyebrow { font-size: var(--step--1); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
a { color: var(--firm); }
:focus-visible { outline: 3px solid var(--firm); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
.narrow { max-width: 620px; }
.stack { display: grid; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.panel.flat { box-shadow: none; }
.panel h2 { font-size: var(--step-1); margin-bottom: 4px; }

/* buttons */
.btn {
  appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; line-height: 1.2; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.15); }
.btn.firm { background: var(--firm); border-color: var(--firm); color: var(--firm-ink); }
.btn.sup { background: var(--sup); border-color: var(--sup); color: var(--sup-ink); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { background: var(--surface); border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: var(--step--1); }
.btn.big { min-height: 56px; font-size: var(--step-1); padding: 14px 22px; }
.btn.wide { width: 100%; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: var(--step--1);
  font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
}
.chip.firm { background: var(--firm-soft); border-color: transparent; color: var(--firm); }
.chip.sup { background: var(--sup-soft); border-color: transparent; color: var(--sup); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.warn { color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

/* forms */
label.field { display: grid; gap: 6px; font-weight: 600; font-size: var(--step--1); }
label.field .hint { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], textarea, select {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 10px 12px;
  min-height: 44px;
}
textarea { min-height: 120px; font-family: var(--font-num); font-size: 13px; }
.radio-cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.radio-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px; cursor: pointer; background: var(--surface); }
.radio-card input { margin-top: 4px; }
.radio-card b { font-size: var(--step-0); }
.radio-card span { grid-column: 2; color: var(--muted); font-size: var(--step--1); }
.radio-card:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.msg { padding: 10px 12px; border-radius: 8px; font-size: var(--step--1); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* landing */
.landing { display: grid; gap: 28px; padding-block: 28px; }
.landing h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 800; letter-spacing: -.02em; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 60ch; }
.choices { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.choice {
  text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 20px;
  cursor: pointer; display: grid; gap: 4px; font-size: var(--step-1); font-weight: 700; font-stretch: 108%;
}
.choice span { font-size: var(--step--1); font-weight: 400; color: var(--muted); font-stretch: 100%; }
.choice:hover { border-color: var(--ink); }

/* the shrinking surplus schedule */
.schedule { display: grid; gap: 6px; }
.sched-row { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) 7.2rem; gap: 10px; align-items: center; }
.sched-row .lbl { font-size: var(--step--1); color: var(--muted); font-weight: 600; }
.sched-row .val { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 500; }
.sched-row.now .lbl, .sched-row.now .val { color: var(--ink); font-weight: 700; }
.sched-row.past { opacity: .55; }
.track {
  position: relative; height: 24px; border-radius: 5px; overflow: hidden;
  background: repeating-linear-gradient(135deg, var(--line) 0 5px, transparent 5px 10px);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--lost) 38%, transparent) 0 5px, transparent 5px 10px);
  border: 1px solid var(--line);
}
.track > .fill { position: absolute; inset: 0 auto 0 0; display: flex; }
.track .seg { height: 100%; }
.track .seg.firm { background: var(--firm); }
.track .seg.sup { background: var(--sup); }
.track .seg.pie { background: var(--line-strong); }
.track .seg.pie.firm-turn { background: var(--firm-soft); background: color-mix(in srgb, var(--firm) 45%, var(--surface)); }
.track .seg.pie.sup-turn { background: var(--sup-soft); background: color-mix(in srgb, var(--sup) 45%, var(--surface)); }
.schedule .track .seg.pie.firm-turn { background: var(--firm); }
.schedule .track .seg.pie.sup-turn { background: var(--sup); }
.who { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.who.firm { color: var(--firm); }
.who.sup { color: var(--sup); }
.rw { font-weight: 700; }
.rw.firm { color: var(--firm); }
.rw.sup { color: var(--sup); }
.sched-row .lbl .who-sm { display: none; }
.chart .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }

/* console chrome */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.topbar .inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.brandmark { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brandmark b { font-size: var(--step-1); font-stretch: 115%; font-weight: 800; white-space: nowrap; }
.brandmark .code { font-family: var(--font-num); font-weight: 600; letter-spacing: .08em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--muted); min-height: 40px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab:hover:not([aria-selected="true"]) { background: var(--surface-2); color: var(--ink); }
.tools { display: flex; gap: 6px; align-items: center; }
.banner { background: var(--bad-soft); color: var(--bad); padding: 10px 16px; text-align: center; font-weight: 600; }
.banner .btn { margin-left: 10px; }

/* board */
.gamehead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.gamehead h2 { font-size: var(--step-3); font-weight: 800; }
.lanes { display: grid; gap: 14px; }
.lane {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 9.5rem; gap: 18px; align-items: center;
}
.party { display: grid; gap: 2px; }
.party b { font-size: var(--step-2); font-stretch: 110%; line-height: 1.1; overflow-wrap: anywhere; }
.party.right { text-align: right; }
.party .earn { font-family: var(--font-num); font-size: var(--step--1); color: var(--muted); }
.mid { display: grid; gap: 10px; min-width: 0; }
.status-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.status-line .what { font-weight: 700; font-size: var(--step-1); }
.status-line .clock { font-family: var(--font-num); color: var(--muted); }
.status-line .clock.late { color: var(--warn); font-weight: 600; }
.lane .track { height: 34px; border-radius: 7px; }
.track .tag { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--font-num); font-size: 12px; font-weight: 600; padding: 0 8px; white-space: nowrap; }
.track .tag.firm { color: var(--firm-ink); }
.track .tag.sup { color: var(--sup-ink); }
.schedule .track .tag { font-family: var(--font-ui); text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.steps li { font-family: var(--font-num); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps li.rej { text-decoration: line-through; }
.steps li.cur { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.steps li.acc { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
.steps li.fail { background: var(--bad-soft); border-color: transparent; color: var(--bad); font-weight: 600; }
.outcome { font-weight: 700; }
.outcome.deal { color: var(--ok); }
.outcome.nodeal { color: var(--bad); }
.manual { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.manual label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.manual input { width: 9rem; min-height: 38px; padding: 6px 10px; }
.present .ctl { display: none !important; }
.present .lane { padding: 20px; }
.present .party b { font-size: var(--step-3); }

/* join */
.joingrid { display: grid; gap: 20px; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; }
.qr { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
.qr svg { width: 100%; height: auto; display: block; }
.bigcode { font-family: var(--font-num); font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 600; letter-spacing: .14em; }
.linkbox { font-family: var(--font-num); font-size: 14px; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.teamgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.teamcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: grid; gap: 6px; }
.teamcard .name { font-weight: 700; font-size: var(--step-1); font-stretch: 108%; }
.teamcard.on { border-color: var(--ok); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); }
td.n, th.n { text-align: right; }
td.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tr.reveal td { animation: fadein .35s ease both; }
tr.pending td { color: transparent; }
tr.pending td:first-child, tr.pending td:nth-child(2), tr.pending td:nth-child(3) { color: var(--ink); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* stats */
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); display: grid; gap: 2px; }
.stat .v { font-family: var(--font-num); font-size: var(--step-2); font-weight: 600; }
.stat .k { font-size: var(--step--1); color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink); font-family: var(--font-ui); }
.chart .mut { fill: var(--muted); }
.chart .grid { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(--step--1); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

/* rules card */
.rules { display: grid; gap: 18px; }
.rules ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.rules li::marker { font-weight: 700; color: var(--muted); }
.present .rules { font-size: 1.25rem; }

/* team (phone) */
.team { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 14px; }
.teamhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.teamhead h1 { font-size: var(--step-3); font-weight: 800; }
.rolebar { border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.rolebar.firm { background: var(--firm); color: var(--firm-ink); }
.rolebar.sup { background: var(--sup); color: var(--sup-ink); }
.rolebar .big { font-size: var(--step-2); font-weight: 800; font-stretch: 112%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.card h2 { font-size: var(--step-2); font-weight: 800; }
.split-in { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split-in label { display: grid; gap: 6px; font-weight: 700; font-size: var(--step--1); }
.split-in label.firm { color: var(--firm); }
.split-in label.sup { color: var(--sup); }
.split-in input { font-family: var(--font-num); font-size: var(--step-1); font-weight: 600; }
input[type="range"] { width: 100%; accent-color: var(--ink); }
.offerline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.offerline > div { border-radius: 10px; padding: 10px 12px; display: grid; gap: 0; }
.offerline .f { background: var(--firm-soft); color: var(--firm); }
.offerline .s { background: var(--sup-soft); color: var(--sup); }
.offerline .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.offerline .v { font-family: var(--font-num); font-size: var(--step-2); font-weight: 600; }
.ifreject { font-size: var(--step--1); color: var(--muted); border-left: 3px solid var(--line-strong); padding-left: 10px; }
.ifreject.final { border-color: var(--bad); color: var(--bad); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist li { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: 8px; font-size: var(--step--1); align-items: baseline; }
.hist .r { font-family: var(--font-num); color: var(--muted); }
.wait { display: flex; align-items: center; gap: 12px; }
.pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); animation: pulse 1.4s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
.picker { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pick { border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px 12px; background: var(--surface); cursor: pointer; display: grid; gap: 4px; text-align: left; }
.pick b { font-size: var(--step-1); font-stretch: 110%; }
.pick:disabled { opacity: .5; cursor: not-allowed; }
.footer { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: space-between; align-items: center; font-size: var(--step--1); color: var(--muted); }

/* toast + modal */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); font-weight: 600; }
.modal { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--surface); border-radius: 14px; padding: 22px; max-width: 520px; width: 100%; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; box-shadow: var(--shadow); }

@media (max-width: 560px) {
  .sched-row { grid-template-columns: 4.8rem minmax(0, 1fr) 6.2rem; }
  .schedule .track .tag { display: none; }
  .sched-row .lbl .who-sm { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; line-height: 1.1; }
  .sched-row .lbl .who-sm.firm { color: var(--firm); }
  .sched-row .lbl .who-sm.sup { color: var(--sup); }
}
@media (max-width: 760px) {
  .lane { grid-template-columns: 1fr 1fr; }
  .lane .mid { grid-column: 1 / -1; grid-row: 2; }
  .party.right { text-align: right; }
  .joingrid { grid-template-columns: 1fr; }
  .tabs { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  /* --------------------------------------------- Firebase Realtime Database (REST) */
  function HttpError(status) { var e = new Error('HTTP ' + status); e.status = status; return e; }
  var RT = {
    norm: function (u) {

      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      try { var x = new URL(u); return x.origin; } catch (e) { return ''; }
    },
    url: function (base, path, q) { return base + '/' + path + '.json' + (q ? '?' + q : ''); },
    put: function (base, path, val) {
      return fetch(RT.url(base, path, 'print=silent'), { method: 'PUT', body: JSON.stringify(val), cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw HttpError(r.status); });
    },
    post: function (base, path, val) {
      return fetch(RT.url(base, path), { method: 'POST', body: JSON.stringify(val), cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw HttpError(r.status); return r.json(); })
        .then(function (j) { return j && j.name; });
    },
    get: function (base, path) {

    },
    del: function (base, path) {
      return fetch(RT.url(base, path, 'print=silent'), { method: 'DELETE', cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw HttpError(r.status); });
    },
    setAt: function (root, path, value) {
      var parts = String(path || '/').split('/').filter(Boolean);
      if (!parts.length) return value == null ? null : value;
      if (!root || typeof root !== 'object') root = {};
      var o = root;
      for (var j = 0; j < parts.length - 1; j++) {
        if (!o[parts[j]] || typeof o[parts[j]] !== 'object') o[parts[j]] = {};
        o = o[parts[j]];
      }

      return root;
    },
    /* Streams a location with Server-Sent Events, the way the Firebase REST API documents it. */
    listen: function (base, path, onData, onStatus) {

        if (closed) return;
        try { es = new EventSource(RT.url(base, path)); } catch (e) { onStatus && onStatus('error'); return; }

          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
          data = RT.setAt(data, m.path, m.data); onData(data);
        });
        es.addEventListener('patch', function (ev) {
          var m; try { m = JSON.parse(ev.data); } catch (e) { return; }

            clearTimeout(timer);

    }

    if (e && e.status) return 'The database answered with an error (' + e.status + ').';

  /* ----------------------------------------------------------------- QR code */

        '<span class="tag ' + roleCls(role) + '" style="left:0">' + roleName(role) + ' proposes</span></div>' +
        '<span class="val">' + money(pie) + '</span></div>';

      '<div><p class="eyebrow">ELA #2 · Bargaining power' + (gameNo ? ' · Game ' + gameNo : '') + '</p><h2 style="font-size:var(--step-3);font-weight:800">The Shrinking Contract</h2></div>' +

      '<ol>' +
      '<li>In round 1 the <b class="rw ' + roleCls(first) + '">' + roleName(first) + '</b> proposes a split: how much goes to the Firm and how much to the Supplier.</li>' +
      '<li>The <b class="rw ' + roleCls(second) + '">' + roleName(second) + '</b> accepts or rejects. If it accepts, the contract is signed and each side gets its share.</li>' +

  /* split bar for one negotiation; widths are shares of the original surplus */

    function tag(cls, text, leftPct, rightAlign) {
      return '<span class="tag ' + cls + '" style="' + (rightAlign ? 'right:' + (100 - leftPct).toFixed(2) + '%' : 'left:' + leftPct.toFixed(2) + '%') + '">' + text + '</span>';

        if (N.out.firm / base > .16) tags += tag('firm', money(N.out.firm), 0);
        if (N.out.sup / base > .16) tags += tag('sup', money(N.out.sup), 100 * (N.out.firm + N.out.sup) / base, true);

  function lastWordChart(T, shrink, firstRole) {
    var maxT = 10, L = 60, R = 980, W = R - L, top = 20, H = 250, bot = H - 40, ch = bot - top;
    function y(f) { return bot - ch * f; }
    var bw = W / maxT * .62;
    var s = '<svg class="chart" viewBox="0 0 1000 ' + H + '" role="img" aria-label="Share kept by the first proposer, by number of rounds">';
    [0, .25, .5, .75, 1].forEach(function (f) {
      s += '<line class="grid" x1="' + L + '" x2="' + R + '" y1="' + y(f) + '" y2="' + y(f) + '"/>';
      s += '<text class="mut" x="' + (L - 8) + '" y="' + (y(f) + 4) + '" font-size="12" text-anchor="end">' + Math.round(f * 100) + '%</text>';
    });
    for (var t = 1; t <= maxT; t++) {
      var f = E.firstShare(t, shrink), cx = L + W * (t - .5) / maxT;
      var col = (t % 2 === 1) ? 'var(--' + roleCls(firstRole) + ')' : 'var(--' + roleCls(E.other(firstRole)) + ')';
      s += '<rect x="' + (cx - bw / 2) + '" y="' + y(f) + '" width="' + bw + '" height="' + (bot - y(f)) + '" fill="' + col + '"' + (t === T ? ' stroke="var(--ink)" stroke-width="3"' : ' opacity=".8"') + '/>';
      s += '<text x="' + cx + '" y="' + (y(f) - 6) + '" font-size="12" text-anchor="middle">' + Math.round(f * 100) + '%</text>';
      s += '<text class="mut" x="' + cx + '" y="' + (bot + 18) + '" font-size="12" text-anchor="middle">' + t + '</text>';
    }
    var inf = 1 / (2 - shrink / 100);

    return s + '</svg>';
  }

  function csvFor(st) {

    var lines = [head.join(',')];
    function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    function d(c) { return c == null || c === '' ? '' : (c / 100).toFixed(2); }
    st.games.forEach(function (G) {
      G.negs.forEach(function (N) {
        var fn = st.teams[N.firm - 1].name, sn = st.teams[N.supplier - 1].name;
        var outc = N.phase === 'deal' ? 'contract' : N.phase === 'nodeal' ? 'no_contract' : 'unfinished';
        var tail = [outc, N.out ? N.out.r : '', N.out ? d(N.out.firm) : '', N.out ? d(N.out.sup) : ''];
        if (!N.hist.length) {
          lines.push([st.sid, G.k + 1, N.i + 1, N.firm, fn, N.supplier, sn, '', '', '', '', '', '', '', '', '', '', ''].concat(tail).map(q).join(','));

  }

        if (!T.dev) { T.dev = m.dev; T.devAt = now(); T.seen = now(); this.log(T.name + ': device connected'); return 'team'; }

      }
      if (m.k !== 'offer' && m.k !== 'resp') return 'none';
      if (!T.dev) { T.dev = m.dev; T.devAt = now(); }
      else if (T.dev !== m.dev) { this.log(T.name + ': ignored a decision sent from a second device'); return 'none'; }

      var err = m.k === 'offer' ? E.offer(st, g, i, r, team, parseInt(m.sup, 10), 'team') : E.respond(st, g, i, r, team, m.acc === true, 'team');
      if (err) { this.log(T.name + ': ignored, ' + err.charAt(0).toLowerCase() + err.slice(1)); return 'none'; }
      var G = st.games[g], N = G.negs[i], h = N.hist[N.hist.length - 1];
      if (m.k === 'offer') this.log(T.name + ' proposed in round ' + r + ': Firm ' + money(h.firm) + ', Supplier ' + money(h.sup));

    },

    /* ---- actions */
    act: function (a, el) {
      var self = this, st = this.st;
      if (a === 'tab') { this.tab = el.getAttribute('data-tab'); this.renderShell(); return; }
      if (a === 'present') { this.present = !this.present; document.body.classList.toggle('present', this.present); this.renderShell(); return; }
      if (a === 'theme') { Theme.cycle(); return; }
      if (a === 'show') { this.show = !this.show; this.render(); return; }
      if (a === 'manual') { this.manualOn = !this.manualOn; this.render(); return; }
      if (a === 'undo') { this.undoLast(); return; }
      if (a === 'start') {
        if (st.cur >= 0 && st.games[st.cur].status === 'live') return;
        var k = st.games.length;
        var missing = st.mode === 'live' ? st.teams.filter(function (t) { return !t.dev; }) : [];
        var go = function () { self.commit(function (s) { var e = E.startGame(s); if (!e) self.log('Game ' + (k + 1) + ' started'); return e; }); self.tab = 'board'; self.renderShell(); };

          openModal('<h2>Start Game ' + (k + 1) + '?</h2><p>' + missing.length + ' team' + (missing.length > 1 ? 's have' : ' has') + ' no device connected yet (' + esc(missing.map(function (t) { return t.name; }).join(', ')) + '). You can still start and type their decisions yourself.</p>' +
            '<div class="row"><button class="btn primary" data-m="go">Start anyway</button><button class="btn" data-m="close" autofocus>Wait</button></div>', function (x) { if (x === 'go') { closeModal(); go(); } });
        } else go();
        return;
      }
      if (a === 'offer') {
        var i = parseInt(el.getAttribute('data-i'), 10), G = st.games[st.cur], N = G && G.negs[i];
        if (!N) return;
        var inp = document.getElementById('mo-' + i), val = parseMoney(inp && inp.value);
        var r0 = N.round, pie = E.pie(G.params, r0), team = E.teamOf(N, E.proposer(G.params, r0));
        if (isNaN(val) || val > pie) { toast('Type the Supplier’s share: between $0 and ' + money(pie) + '.', 3200); if (inp) inp.focus(); return; }
        delete this.drafts['mo-' + i];
        this.commit(function (s) {
          var e = E.offer(s, s.cur, i, r0, null, val, 'console');
          if (!e) self.log(s.teams[team - 1].name + ' proposed in round ' + r0 + ' (typed): Firm ' + money(pie - val) + ', Supplier ' + money(val));
          return e;
        });
        return;
      }
      if (a === 'acc' || a === 'rej') {
        var j = parseInt(el.getAttribute('data-i'), 10), G2 = st.games[st.cur], N2 = G2 && G2.negs[j];
        if (!N2) return;
        var r = N2.round, resp = E.teamOf(N2, E.other(E.proposer(G2.params, r)));
        this.commit(function (s) {
          var e = E.respond(s, s.cur, j, r, null, a === 'acc', 'console');
          if (!e) {
            self.log(s.teams[resp - 1].name + (a === 'acc' ? ' accepted' : ' rejected') + ' in round ' + r + ' (typed)');
            if (s.games[s.cur].status === 'done') self.log('Game ' + (s.cur + 1) + ' complete');
          }
          return e;
        });
        return;
      }
      if (a === 'release') {
        var t = parseInt(el.getAttribute('data-t'), 10);
        this.commit(function (s) { s.teams[t - 1].dev = ''; s.teams[t - 1].devAt = 0; self.log(s.teams[t - 1].name + ': device released'); return null; }, true);
        toast('Released. The next device that joins as this team takes over.'); return;
      }
      if (a === 'rename') {
        var tt = parseInt(el.getAttribute('data-t'), 10), cur = st.teams[tt - 1];
        openModal('<h2>Rename ' + esc(cur.name) + '</h2><label class="field">Name<input type="text" id="rn" maxlength="40" value="' + esc(cur.name) + '" autofocus></label>' +
          '<div class="row"><button class="btn primary" data-m="ok">Save</button><button class="btn" data-m="close">Cancel</button></div>', function (x, b, box) {
          if (x !== 'ok') return;
          var v = box.querySelector('#rn').value.trim().slice(0, 40) || ('Team ' + tt);

        });
        return;
      }
      if (a === 'res-view') { this.resView = el.getAttribute('data-v'); this.render(); return; }
      if (a === 'bi-next') { this.step = Math.min(this.step + 1, (this.theoryParams().rounds)); this.render(); return; }
      if (a === 'bi-all') { this.step = this.theoryParams().rounds; this.render(); return; }
      if (a === 'bi-reset') { this.step = 0; this.render(); return; }
      if (a === 'copy-csv') { copyText(csvFor(st), 'CSV copied'); return; }
      if (a === 'dl-csv') { download('ela2_' + st.sid + '.csv', csvFor(st), 'text/csv'); return; }
      if (a === 'copy-json') { copyText(JSON.stringify(st), 'Backup copied'); return; }
      if (a === 'dl-json') { download('ela2_' + st.sid + '.json', JSON.stringify(st, null, 1), 'application/json'); return; }

        this.ro = false; this.st.cid = this.cid; this.st.rev += 1; this.log('Took back control'); this.save(); this.push(); this.renderShell(); return;

          if (x === 'yes') { closeModal(); self.disconnect(); self.st = null; document.body.classList.remove('present'); self.present = false; self.start(); }
        });

          '<div class="row"><button class="btn bad" data-m="yes">Delete</button><button class="btn" data-m="close" autofocus>Cancel</button></div>', function (x) {
          if (x === 'yes') { closeModal(); self.disconnect(); LS.del('ela2.console'); self.st = null; self.saved = null; document.body.classList.remove('present'); self.present = false; self.start(); }
        });

      }
    },

    resultsHTML: function () {
      var st = this.st, self = this;

      var games = this.resView === 'all' ? st.games : st.games.filter(function (G) { return 'g' + G.k === self.resView; });
      var rows = []; games.forEach(function (G) { G.negs.forEach(function (N) { rows.push(negSummary(G, N)); }); });
      var S = statsFor(rows), p = games[0].params, spe = E.spe(p)[0], base = p.pie;

      var chips = views.map(function (v) { return '<button class="btn sm' + (self.resView === v[0] ? ' primary' : '') + '" data-act="res-view" data-v="' + v[0] + '">' + v[1] + '</button>'; }).join('');

    theoryParams: function () { var st = this.st; return st.games.length ? st.games[0].params : st.params; },
    theoryHTML: function () {
      var st = this.st, p = this.theoryParams(), rows = E.spe(p), T = p.rounds, step = this.step, self = this;

        if (x.r === 1) {

        }
      }

        '<section class="panel stack"><div class="tablewrap"><table><thead><tr><th class="n">Round</th><th class="n">Surplus</th><th>Proposes</th><th class="n">Responder gets by saying no</th><th class="n">Proposal</th><th class="n">Proposer keeps</th></tr></thead><tbody>' + trs + '</tbody></table></div>' +

        '<section class="panel stack"><div class="spread"><div><h2>Who has the last word?</h2><p class="muted small">Share kept by the ' + roleName(fr) + ' (who proposes first) when both sides play the theory, by the number of rounds before the contract is lost.</p></div>' +
        '<label class="field" style="min-width:200px">Shrink<select id="wi-shrink">' + shrinkOpts + '</select></label></div>' +
        lastWordChart(T, shrink, fr) +
        '<p class="small muted">With ' + T + ' rounds and a ' + shrink + '% shrink the ' + roleName(fr) + ' keeps ' + pct(100 * E.firstShare(T, shrink)) + '. One round more or less flips the advantage to whoever proposes last. The smaller the shrink, the more the last word is worth.</p></section>' +

    dataHTML: function () {

        '<div><p class="eyebrow">Data</p><h2 style="font-size:var(--step-3);font-weight:800">Every proposal and answer</h2><p class="muted">One row per proposal. Amounts in dollars. Keep a copy before you delete the session.</p></div>' +
        '<section class="panel stack"><div class="row"><button class="btn primary" data-act="copy-csv">Copy CSV</button>' + (canSave ? '<button class="btn" data-act="dl-csv">Download CSV</button>' : '') +

        '<section class="panel stack ctl"><h2>Session</h2><p class="small muted">Code <b class="num">' + esc(st.sid) + '</b> · ' + (st.mode === 'live' ? 'live, database ' + esc(st.db) : 'this laptop only') + ' · created ' + new Date(st.created).toLocaleString() + '</p>' +

  /* -------------------------------------------------------------- team device */
  var T = {
    sid: '', base: '', team: 0, dev: '', st: null, sub: null, net: 'connecting', missing: false, pending: null,
    turn: '', sound: true, actx: null, wake: null, draft: null, reviewing: false, confirmKind: '',

    entry: function () {
      var can = !!RT.norm(CFG.databaseURL);
      app.innerHTML = '<main class="team"><div class="card"><p class="eyebrow">ELA #2 · The Shrinking Contract</p><h2>Join your team</h2>' +
        (can ? '<form id="joinform" class="stack" novalidate><label class="field">Session code <span class="hint">It is on the screen at the front.</span><input type="text" id="j-code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-family:var(--font-num);font-size:var(--step-2);letter-spacing:.12em;text-transform:uppercase"></label><button class="btn primary big" type="submit">Continue</button></form>'
          : '<p>Scan the QR code on the screen, or open the link your instructor shared. This copy of the page is not connected to a session database.</p>') +
        '</div></main>';
      var f = document.getElementById('joinform');

        ev.preventDefault();

    },
    start: function (sid, base) {
      this.stop();
      this.sid = sid; this.base = base; this.dev = deviceId();

      this.st = null; this.missing = false; this.pending = null; this.turn = '';
      if (!base) {
        app.innerHTML = '<main class="team"><div class="card"><h2>This link is incomplete</h2><p>Scan the QR code on the screen again, or ask your instructor for the team link.</p></div></main>';
        return;
      }
      this.render();
      var self = this;
      this.sub = RT.listen(base, CFG.basePath + '/' + sid + '/state', function (d) { self.onState(d); }, function (s) { self.net = s === 'open' ? 'live' : s === 'denied' ? 'denied' : 'retrying'; self.renderFoot(); });
      clearTimeout(this.missTimer);
      this.missTimer = setTimeout(function () { if (!self.st) { self.missing = true; self.render(); } }, 9000);
      if (this.team) this.hello();

    stop: function () { if (this.sub) this.sub.close(); this.sub = null; clearTimeout(this.missTimer); },
    onState: function (d) {
      if (!d || !d.json) { if (d === null) { this.missing = true; this.render(); } return; }
      var st; try { st = JSON.parse(d.json); } catch (e) { return; }
      this.st = st; this.missing = false;
      if (this.team && (!st.teams[this.team - 1])) { this.team = 0; }

        var mine = this.myTurn();
        this.turn = key; this.pending = null; this.draft = null; this.reviewing = false; this.confirmKind = '';
        if (mine) this.beep();
      }
      this.render();
    },
    turnKey: function () {
      var st = this.st; if (!st || !this.team) return '';
      var G = st.cur >= 0 ? st.games[st.cur] : null, f = E.find(G, this.team);
      if (!f) return 'g' + st.cur;
      return 'g' + st.cur + '-' + f.N.i + '-' + f.N.round + '-' + f.N.phase;
    },
    myTurn: function () {
      var st = this.st; if (!st || !this.team) return false;
      var G = st.cur >= 0 ? st.games[st.cur] : null, f = E.find(G, this.team);
      if (!f || !G || G.status !== 'live' || E.ended(f.N)) return false;
      var prop = E.proposer(G.params, f.N.round);
      return f.N.phase === 'propose' ? prop === f.role : E.other(prop) === f.role;
    },
    captain: function () { var t = this.st && this.st.teams[this.team - 1]; return !!(t && t.dev === this.dev); },
    hello: function () {
      var self = this;
      RT.post(this.base, CFG.basePath + '/' + this.sid + '/inbox', { k: 'hello', team: this.team, dev: this.dev, ts: now() })
        .catch(function () { setTimeout(function () { if (self.team) self.hello(); }, 3000); });
    },
    pick: function (t) {
      var self = this, name = this.st.teams[t - 1].name;
      openModal('<h2>Are you ' + esc(name) + '?</h2><p>This device will make your team’s decisions for the rest of the session. Only one device per team.</p>' +
        '<div class="row"><button class="btn primary" data-m="yes" autofocus>Yes, we are ' + esc(name) + '</button><button class="btn" data-m="close">Back</button></div>', function (a) {
        if (a !== 'yes') return;
        closeModal();
        self.unlockAudio();
        self.team = t; LS.set('ela2.team.' + self.sid, { team: t });
        self.hello(); self.keepAwake();
        self.turn = ''; self.onState({ json: JSON.stringify(self.st) });
      });
    },
    leave: function () {
      var self = this;
      openModal('<h2>Switch team?</h2><p>Only do this if you picked the wrong team. Your instructor may need to release your old team’s device.</p><div class="row"><button class="btn bad" data-m="yes">Switch team</button><button class="btn" data-m="close" autofocus>Stay</button></div>', function (a) {
        if (a !== 'yes') return; closeModal(); self.team = 0; LS.del('ela2.team.' + self.sid); self.render();
      });
    },
    send: function (kind, extra) {
      var st = this.st, G = st.games[st.cur], f = E.find(G, this.team), self = this;
      if (!f) return;
      var msg = Object.assign({ k: kind, team: this.team, dev: this.dev, g: st.cur, i: f.N.i, r: f.N.round, ts: now() }, extra);
      this.pending = { key: this.turnKey(), at: now(), msg: msg, err: false };
      this.render();
      RT.post(this.base, CFG.basePath + '/' + this.sid + '/inbox', msg).then(function () { self.render(); }, function () {
        if (self.pending && self.pending.msg === msg) { self.pending.err = true; self.render(); }
      });
      setTimeout(function () { if (self.pending && self.pending.msg === msg) self.render(); }, 9000);
    },
    resend: function () {
      if (!this.pending) return;
      var self = this, msg = this.pending.msg; this.pending.at = now(); this.pending.err = false; this.render();
      RT.post(this.base, CFG.basePath + '/' + this.sid + '/inbox', msg).catch(function () { if (self.pending) { self.pending.err = true; self.render(); } });
    },
    unlockAudio: function () {
      try { if (!this.actx) this.actx = new (window.AudioContext || window.webkitAudioContext)(); if (this.actx.state === 'suspended') this.actx.resume(); } catch (e) { this.actx = null; }
    },
    beep: function () {
      if (!this.sound) return;

        var a = this.actx; if (!a) return;
        var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
        o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + .12);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .32);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .34);

    },
    keepAwake: function () {

    },

    act: function (a, el) {
      if (a === 'pick') { this.pick(parseInt(el.getAttribute('data-t'), 10)); return; }
      if (a === 'switch') { this.leave(); return; }
      if (a === 'rules') {
        var st = this.st, G = st.cur >= 0 ? st.games[st.cur] : null, p = G && G.status === 'live' ? G.params : st.params;
        openModal(rulesHTML(p, st.stakes, 0) + '<button class="btn primary" data-m="close">Close</button>'); return;
      }
      if (a === 'sound') { this.sound = !this.sound; this.unlockAudio(); this.renderFoot(); return; }
      if (a === 'claim') { this.unlockAudio(); this.hello(); toast('Asked to use this device. Your instructor may need to release the other one first.', 3800); return; }
      if (a === 'review') {
        var d = this.readDraft();
        if (!d) { toast('Type an amount for one side. The two shares must add up to the surplus.', 3200); return; }
        this.draft = d; this.reviewing = true; this.render(); return;
      }
      if (a === 'edit') { this.reviewing = false; this.render(); return; }
      if (a === 'send-offer') { if (this.draft) this.send('offer', { sup: this.draft.sup }); return; }
      if (a === 'ask-acc') { this.confirmKind = 'acc'; this.render(); return; }
      if (a === 'ask-rej') { this.confirmKind = 'rej'; this.render(); return; }
      if (a === 'back') { this.confirmKind = ''; this.render(); return; }
      if (a === 'send-acc') { this.send('resp', { acc: true }); return; }
      if (a === 'send-rej') { this.send('resp', { acc: false }); return; }
      if (a === 'resend') { this.resend(); return; }
    },
    readDraft: function () {
      var info = this.ctx(); if (!info) return null;
      var pie = info.pie, fi = document.getElementById('o-firm'), si = document.getElementById('o-sup');
      var s = parseMoney(si && si.value), f = parseMoney(fi && fi.value);
      if (isNaN(s) && isNaN(f)) return null;
      if (isNaN(s)) s = pie - f;
      if (s < 0 || s > pie) return null;
      if (!isNaN(f) && f + s !== pie) return null;
      return { sup: s, firm: pie - s };
    },
    ctx: function () {
      var st = this.st; if (!st || !this.team) return null;
      var G = st.cur >= 0 ? st.games[st.cur] : null, f = E.find(G, this.team);

      var partner = f.role === 'firm' ? N.supplier : N.firm;

    },
    onInput: function (el) {
      var info = this.ctx(); if (!info) return;
      var pie = info.pie, fi = document.getElementById('o-firm'), si = document.getElementById('o-sup');
      if (el.id === 'o-sup') { var s = parseMoney(el.value); if (!isNaN(s) && s <= pie) fi.value = plain(pie - s); else if (el.value.trim() === '') fi.value = ''; }
      else if (el.id === 'o-firm') { var f = parseMoney(el.value); if (!isNaN(f) && f <= pie) si.value = plain(pie - f); else if (el.value.trim() === '') si.value = ''; }
      this.preview();
    },
    preview: function () {
      var info = this.ctx(); if (!info) return;
      var pie = info.pie, si = document.getElementById('o-sup'), fi = document.getElementById('o-firm');
      var bar = document.getElementById('o-bar'), pctEl = document.getElementById('o-pct');

      bar.innerHTML = ok ? '<div class="fill" style="width:' + (100 * pie / info.p.pie).toFixed(3) + '%"><div class="seg firm" style="width:' + (100 * f / pie).toFixed(3) + '%"></div><div class="seg sup" style="width:' + (100 * s / pie).toFixed(3) + '%"></div></div>' : '';
      if (pctEl) pctEl.textContent = ok ? 'Firm ' + pct(100 * f / pie) + ' · Supplier ' + pct(100 * s / pie) + ' of ' + money(pie) : 'The two shares must add up to ' + money(pie) + '.';
    },

    render: function () {
      var st = this.st;

        app.innerHTML = '<main class="team"><div class="card"><p class="eyebrow">ELA #2 · The Shrinking Contract</p>' +
          (this.missing ? '<h2>Session not found</h2><p>Check the code <b class="num">' + esc(this.sid) + '</b> against the screen, or scan the QR code again. If it is right, the instructor’s screen may not be open yet.</p><button class="btn" data-act="t-reload">Try again</button>'
            : '<div class="wait"><span class="pulse"></span><div><h2>Connecting…</h2><p class="muted">Session <span class="num">' + esc(this.sid) + '</span></p></div></div>') +

      this.renderFoot(); tick();
    },
    signature: function () {
      var st = this.st, G = st.cur >= 0 ? st.games[st.cur] : null, f = E.find(G, this.team);

      return JSON.stringify([st.cur, G && G.status, f && f.N, st.teams, st.games.length, st.params, st.stakes, E.earnings(st, this.team),

    },
    renderPicker: function () {

          '<span class="small muted">' + (t.dev ? 'A device is already connected' : 'Free') + '</span></button>';
      }).join('');
      app.innerHTML = '<main class="team"><div class="card"><p class="eyebrow">Session <span class="num">' + esc(this.sid) + '</span></p><h2>Which team are you?</h2>' +
        '<p class="muted">Pick the number your instructor gave your team. One device per team.</p><div class="picker">' + btns + '</div></div><div class="footer" id="foot"></div></main>';
      this.renderFoot();
    },
    renderFoot: function () {
      var el = document.getElementById('foot'); if (!el) return;
      var map = { live: 'Connected', retrying: 'Reconnecting…', denied: 'Access denied', connecting: 'Connecting…' };
      el.innerHTML = '<span><span class="dot" style="color:' + (this.net === 'live' ? 'var(--ok)' : 'var(--warn)') + '"></span> ' + (map[this.net] || 'Connecting…') + ' · <span class="num">' + esc(this.sid) + '</span></span>' +
        (this.team ? '<span class="row" style="gap:6px"><button class="btn sm ghost" data-act="rules">Rules</button><button class="btn sm ghost" data-act="sound">' + (this.sound ? 'Sound on' : 'Sound off') + '</button><button class="btn sm ghost" data-act="switch">Switch team</button></span>' : '');
    },
    dashHTML: function () {
      var st = this.st, me = st.teams[this.team - 1], cap = this.captain();
      var G = st.cur >= 0 ? st.games[st.cur] : null, info = this.ctx();
      var earned = E.earnings(st, this.team);
      var head = '<div class="teamhead"><h1>' + esc(me.name) + '</h1><span class="chip">Earned <span class="money">' + money(earned) + '</span></span></div>';
      var follower = me.dev && !cap;
      var who = follower ? '<p class="msg info">Another device is registered for ' + esc(me.name) + '. This screen follows along but cannot send decisions. <button class="btn sm" data-act="claim">Use this device instead</button></p>'
        : (!me.dev ? '<p class="msg info">Registering this device… It needs the instructor’s screen to be open.</p>' : '');
      var body = '';
      if (!G) {
        var nextPairs = E.pairings(st.teams.length, st.games.length), pr = nextPairs.filter(function (p) { return p.firm === me.id || p.supplier === me.id; })[0];
        var role = pr ? (pr.firm === me.id ? 'firm' : 'supplier') : 'firm', partner = pr ? (role === 'firm' ? pr.supplier : pr.firm) : 0;
        body = this.roleBar(role, 'Game 1', partner) +
          '<div class="card"><div class="wait"><span class="pulse"></span><div><h2>Get ready</h2><p class="muted">The instructor will start Game 1 shortly.</p></div></div>' +
          '<p>You play the <b class="rw ' + roleCls(role) + '">' + roleName(role) + '</b>' + (partner ? ' against <b>' + esc(st.teams[partner - 1].name) + '</b>' : '') + '. Read the rules while you wait.</p></div>' +
          '<div class="card">' + rulesHTML(st.params, st.stakes, 0) + '</div>';
        return '<main class="team">' + head + who + body + '<div class="footer" id="foot"></div></main>';
      }
      if (!info) {
        body = '<div class="card"><h2>You sit out this game</h2><p class="muted">Wait for the next one.</p></div>';
        return '<main class="team">' + head + who + body + '<div class="footer" id="foot"></div></main>';
      }
      var N = info.N, p = info.p, role = info.role, opp = E.other(role);
      body = this.roleBar(role, 'Game ' + (G.k + 1), info.partner);
      var card = '';
      var lastH = N.hist[N.hist.length - 1];
      var nextPie = N.round < p.rounds ? E.pie(p, N.round + 1) : 0;
      var ifRej = N.round < p.rounds
        ? '<p class="ifreject">If this proposal is rejected: round ' + (N.round + 1) + ', the surplus falls to <b class="money">' + money(nextPie) + '</b> and the ' + roleName(E.proposer(p, N.round + 1)) + ' proposes.</p>'
        : '<p class="ifreject final"><b>Last round.</b> If this proposal is rejected there is no contract: both sides get $0.</p>';
      var pend = this.pending && this.pending.key === this.turn ? this.pending : null;
      if (E.ended(N)) {
        if (N.phase === 'deal') {
          var mine = role === 'firm' ? N.out.firm : N.out.sup;
          card = '<div class="card"><p class="eyebrow">Game ' + (G.k + 1) + ' · round ' + N.out.r + '</p><h2 style="color:var(--ok)">Contract signed</h2>' +
            '<div class="offerline"><div class="f"><span class="k">Firm</span><span class="v">' + money(N.out.firm) + '</span></div><div class="s"><span class="k">Supplier</span><span class="v">' + money(N.out.sup) + '</span></div></div>' +
            '<p>Your team earns <b class="money">' + money(mine) + '</b> in this game.' + (N.out.r > 1 ? ' Delay cost the two sides <b class="money">' + money(p.pie - E.pie(p, N.out.r)) + '</b> of surplus.' : '') + '</p></div>';
        } else {
          card = '<div class="card"><p class="eyebrow">Game ' + (G.k + 1) + '</p><h2 style="color:var(--bad)">No contract</h2><p>The proposal in round ' + p.rounds + ' was rejected. Both sides get $0 in this game, and the whole ' + money(p.pie) + ' is lost.</p></div>';
        }
        card += G.status === 'done'
          ? '<div class="card"><h2>Game ' + (G.k + 1) + ' is over</h2><p class="muted">Results are on the screen. If there is another game, you will get a new partner and the other role.</p></div>'
          : '<div class="card"><div class="wait"><span class="pulse"></span><p>Waiting for the other negotiations to finish.</p></div></div>';
      } else if (N.phase === 'propose' && info.prop === role) {
        if (!cap) card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><h2>Your turn to propose</h2><p class="muted">The registered device sends your proposal. Surplus on the table: <b class="money">' + money(info.pie) + '</b>.</p></div>';
        else if (pend) card = this.pendingCard(pend, 'Proposal sent');
        else if (this.reviewing && this.draft) {
          card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + ' · check before sending</p><h2>Send this proposal to ' + esc(info.partnerName) + '?</h2>' +
            '<div class="offerline"><div class="f"><span class="k">Firm gets</span><span class="v">' + money(this.draft.firm) + '</span></div><div class="s"><span class="k">Supplier gets</span><span class="v">' + money(this.draft.sup) + '</span></div></div>' +
            ifRej + '<div class="actions"><button class="btn" data-act="edit">Change it</button><button class="btn primary" data-act="send-offer">Send proposal</button></div></div>';
        } else {
          /* no pre-filled split: a default number would anchor the proposal */
          card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><h2>Your turn: propose a split of ' + money(info.pie) + '</h2>' +
            '<p class="small muted">Type the amount for either side; the other side gets the rest.</p>' +
            '<div class="split-in"><label class="firm" for="o-firm">Firm gets ($)<input type="text" inputmode="decimal" id="o-firm" autocomplete="off" placeholder="0"></label>' +
            '<label class="sup" for="o-sup">Supplier gets ($)<input type="text" inputmode="decimal" id="o-sup" autocomplete="off" placeholder="0"></label></div>' +
            '<div class="track" id="o-bar" style="height:30px"></div><p class="small muted" id="o-pct">The two shares must add up to ' + money(info.pie) + '.</p>' +
            ifRej + '<button class="btn primary big wide" data-act="review">Review proposal</button></div>';
        }
      } else if (N.phase === 'propose') {
        card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><div class="wait"><span class="pulse"></span><div><h2>Waiting for ' + esc(info.partnerName) + '</h2>' +
          '<p class="muted">The ' + roleName(opp) + ' is preparing a proposal for <b class="money">' + money(info.pie) + '</b>.</p></div></div>' +
          '</div>';
      } else if (N.phase === 'respond' && info.prop !== role) {
        if (!cap) card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><h2>' + esc(info.partnerName) + ' proposes</h2>' + this.offerLine(lastH) + '<p class="muted">The registered device sends your answer.</p></div>';
        else if (pend) card = this.pendingCard(pend, 'Answer sent');
        else if (this.confirmKind) {
          var yes = this.confirmKind === 'acc', myShare = role === 'firm' ? lastH.firm : lastH.sup;
          card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + ' · check before sending</p><h2>' + (yes ? 'Accept this proposal?' : 'Reject this proposal?') + '</h2>' + this.offerLine(lastH) +
            '<p>' + (yes ? 'The contract is signed and your team earns <b class="money">' + money(myShare) + '</b> in this game.'
              : (N.round < p.rounds ? 'The surplus falls to <b class="money">' + money(nextPie) + '</b> and your team proposes in round ' + (N.round + 1) + '.' : 'This is the last round: there will be no contract and both sides get $0.')) + '</p>' +
            '<div class="actions"><button class="btn" data-act="back">Back</button><button class="btn ' + (yes ? 'ok' : 'bad') + '" data-act="' + (yes ? 'send-acc' : 'send-rej') + '">' + (yes ? 'Yes, accept' : 'Yes, reject') + '</button></div></div>';
        } else {
          card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><h2>' + esc(info.partnerName) + ' proposes</h2>' + this.offerLine(lastH) +
            '<div class="track" style="height:30px"><div class="fill" style="width:' + (100 * info.pie / p.pie).toFixed(3) + '%"><div class="seg firm" style="width:' + (100 * lastH.firm / info.pie).toFixed(3) + '%"></div><div class="seg sup" style="width:' + (100 * lastH.sup / info.pie).toFixed(3) + '%"></div></div></div>' +
            ifRej + '<div class="actions"><button class="btn bad big" data-act="ask-rej">Reject</button><button class="btn ok big" data-act="ask-acc">Accept</button></div></div>';
        }
      } else {
        card = '<div class="card"><p class="eyebrow">Round ' + N.round + ' of ' + p.rounds + '</p><h2>Proposal sent</h2>' + this.offerLine(lastH) +
          '<div class="wait"><span class="pulse"></span><p>Waiting for ' + esc(info.partnerName) + ' to accept or reject.</p></div></div>';
      }
      var hist = N.hist.filter(function (h) { return h.resp; }).map(function (h) {
        return '<li><span class="r">R' + h.r + '</span><span><span class="rw ' + roleCls(h.by) + '">' + roleName(h.by) + '</span> proposed Firm <span class="money">' + money(h.firm) + '</span> · Supplier <span class="money">' + money(h.sup) + '</span></span><span class="' + (h.resp === 'accept' ? 'outcome deal' : 'outcome nodeal') + '">' + (h.resp === 'accept' ? 'Accepted' : 'Rejected') + '</span></li>';
      }).join('');
      var rejected = N.hist.filter(function (h) { return h.resp === 'reject'; }).length;
      body += card +
        (hist ? '<div class="card"><h3 style="font-size:var(--step-1)">This negotiation so far</h3><ul class="hist">' + hist + '</ul></div>' : '') +
        '<div class="card"><h3 style="font-size:var(--step-1)">Surplus by round</h3>' + scheduleHTML(p, E.ended(N) ? 0 : N.round, rejected) + '</div>';
      return '<main class="team">' + head + who + body + '<div class="footer" id="foot"></div></main>';
    },
    roleBar: function (role, game, partner) {
      var st = this.st;
      return '<div class="rolebar ' + roleCls(role) + '"><span class="small" style="opacity:.85">' + game + (partner ? ' · against ' + esc(st.teams[partner - 1].name) : '') + '</span><span class="big">You are the ' + roleName(role) + '</span></div>';
    },
    offerLine: function (h) {
      return '<div class="offerline"><div class="f"><span class="k">Firm gets</span><span class="v">' + money(h.firm) + '</span></div><div class="s"><span class="k">Supplier gets</span><span class="v">' + money(h.sup) + '</span></div></div>';
    },
    pendingCard: function (pend, title) {
      var late = now() - pend.at > 8000;
      return '<div class="card"><h2>' + title + '</h2><div class="wait"><span class="pulse"></span><p>' +
        (pend.err ? 'It did not go through. Check the connection and send it again.' : late ? 'Not confirmed yet. The instructor’s screen may be offline.' : 'Waiting for confirmation…') + '</p></div>' +
        (pend.err || late ? '<button class="btn" data-act="resend">Send again</button>' : '') + '</div>';
    }
  };

  /* -------------------------------------------------------------- live clocks */
  function tick() {
    var els = document.querySelectorAll('[data-since]'), t = now();
    for (var j = 0; j < els.length; j++) {
      var el = els[j], ms = t - parseInt(el.getAttribute('data-since'), 10), lim = parseInt(el.getAttribute('data-limit'), 10) || 0;
      el.textContent = clock(ms);
      el.classList.toggle('late', lim > 0 && ms > lim * 1000);
    }
  }
  setInterval(tick, 1000);

  /* --------------------------------------------------------------- dispatch */
  var mode = '';
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act');
    if (a === 'go-console') { if (!IN_VIEWER) history.replaceState(null, '', '#console'); mode = 'console'; C.start(); return; }
    if (a === 'go-join') { history.replaceState(null, '', '#join'); mode = 'team'; T.entry(); return; }
    if (a === 'resume') { C.resume(); return; }
    if (a === 'discard') { C.discard(); return; }
    if (a === 'testdb') { C.testDb(); return; }
    if (a === 'takeover') { C.takeover(); return; }
    if (a === 't-reload') { T.start(T.sid, T.base); return; }
    if (mode === 'team') T.act(a, b); else C.act(a, b);
  });
  app.addEventListener('input', function (ev) {
    var id = ev.target.id || '';
    if (mode === 'team' && /^o-(firm|sup)$/.test(id)) {
      T.onInput(ev.target);
      var fi = document.getElementById('o-firm'), si = document.getElementById('o-sup');
      T.draftVals = { key: T.turn, f: fi ? fi.value : '', s: si ? si.value : '' };
    }
    if (mode === 'console' && /^mo-\d+$/.test(id)) C.drafts[id] = ev.target.value;
  });
  app.addEventListener('toggle', function (ev) {
    if (mode === 'console' && ev.target.id && ev.target.tagName === 'DETAILS') C.open[ev.target.id] = ev.target.open;
  }, true);
  app.addEventListener('change', function (ev) {
    if (mode === 'console' && ev.target.id === 'wi-shrink') { C.wiShrink = parseFloat(ev.target.value); C.render(); }
  });
  app.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && mode === 'console' && /^mo-\d+$/.test(ev.target.id || '')) {
      ev.preventDefault(); var btn = ev.target.closest('.manual').querySelector('[data-act="offer"]'); if (btn) btn.click();
    }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && mode === 'team' && T.team) T.keepAwake(); });

  function boot() {
    closeModal();
    if (C.st) C.disconnect();
    T.stop();
    var hp = new URLSearchParams(location.hash.slice(1));
    var s = (hp.get('s') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s && !IN_VIEWER) { mode = 'team'; T.start(s, RT.norm(hp.get('db') || CFG.databaseURL)); return; }
    if (hp.has('console')) { mode = 'console'; C.start(); return; }
    if (hp.has('join') && !IN_VIEWER) { mode = 'team'; T.entry(); return; }
    mode = ''; renderLanding();
  }
  window.addEventListener('hashchange', boot);
  Theme.init();
  boot();

  /* exposed for automated checks */
  window.ELA2 = { E: E, RT: RT, C: C, T: T, money: money, parseMoney: parseMoney, csvFor: csvFor };
})();

</script>
</body>
</html>
